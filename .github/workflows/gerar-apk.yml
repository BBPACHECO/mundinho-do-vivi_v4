name: Validar Android nativo e gerar APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Instalar SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar, testar e analisar
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest --no-daemon --max-workers=2
      - name: Gerar APK arm64 para o Galaxy A57
        run: ./gradlew -PgalaxyApk :app:assembleDebug --no-daemon --max-workers=2
      - name: Guardar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-0.5-familia
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
            app/build/reports/ui/
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Mundinho-do-Vivi-0.5-Galaxy-A57
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
